<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Douceur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg:#F8F4ED;--surf:#FFFDF8;--ink:#38251F;--coffee:#76513E;--accent:#C69A6B;--blush:#E8C9C1;--sage:#A9B29A;--mute:#6f6258;--line:#E9DFD3;--r:12px}
[data-theme=matcha]{--bg:#F4F6EE;--surf:#FDFFF9;--ink:#2B3326;--coffee:#52653F;--accent:#8FA67A;--blush:#DDE6CF;--sage:#A9B29A;--mute:#62705a;--line:#DCE3CF}
[data-theme=midnight]{--bg:#1E1815;--surf:#2A221E;--ink:#F3E9DC;--coffee:#C69A6B;--accent:#C69A6B;--blush:#4A3A33;--sage:#6c7560;--mute:#B5A596;--line:#4A3D36}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'DM Sans',system-ui,sans-serif;padding-bottom:72px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3rem)}h2{font-size:1.6rem}a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:0;z-index:5}
.brand{font:italic 500 1.4rem 'Playfair Display',Georgia,serif;text-decoration:none}
nav{display:flex;gap:4px}nav a{padding:8px 12px;border-radius:99px;text-decoration:none;font-size:.9rem}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
@media(max-width:700px){nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);justify-content:space-around;padding:6px;z-index:5}nav a{font-size:.75rem;padding:8px 6px}}
main{max-width:1080px;margin:0 auto;padding:24px 20px}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font:inherit;cursor:pointer;text-decoration:none;min-height:44px}
.btn.alt{background:transparent;color:var(--ink)}
.hero{display:grid;gap:24px;grid-template-columns:1.2fr 1fr;align-items:center;margin-bottom:40px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.tile{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;font-size:3rem;text-decoration:none;background:linear-gradient(135deg,hsl(var(--h) 45% 80%),hsl(var(--h) 35% 62%))}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{font-size:1.15rem;margin:0}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 9px;margin:0 4px 4px 0;color:var(--mute)}
.meta{font-size:.85rem;color:var(--mute)}
.fav{margin-left:auto;background:none;border:0;font-size:1.3rem;cursor:pointer;min-width:44px;min-height:44px;color:var(--coffee)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);min-height:44px}
label{display:block;font-size:.85rem;color:var(--mute)}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit}
.chip[aria-pressed=true]{background:var(--sage);border-color:var(--ink);color:#1d1d1d}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.empty{text-align:center;padding:40px 20px;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.stats b{font:500 2rem 'Playfair Display',serif;display:block}
li{margin-bottom:8px}ul.plain{list-style:none;padding:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--ink);max-width:90vw}
.warn{background:var(--blush);color:#38251F;padding:8px 12px;border-radius:8px;font-size:.9rem}
main:focus{outline:none}
button.tile{border:0;width:100%;cursor:pointer;font:inherit}
.fc{perspective:1000px;height:400px}.inner{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg);background:var(--surf)}
.fc:not(.flipped) .back{visibility:hidden;transition:visibility 0s .3s}.fc.flipped .front{visibility:hidden;transition:visibility 0s .3s}
.back .b{justify-content:space-between}.back ul{font-size:.9rem;margin:0}.back li{margin-bottom:3px}
body.splash-on{overflow:hidden}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .7s,transform .7s}
#splash.leaving{opacity:0;transform:scale(1.04);pointer-events:none}
#splash h1{font-size:clamp(2.4rem,8vw,4rem);margin:8px 0 4px}#splash p{margin:0 0 18px;color:var(--mute);font-style:italic}
#splash svg{width:min(60vw,240px);height:auto}
.stream{fill:var(--coffee);transform-box:fill-box;transform-origin:top;opacity:0;animation:pour 3.4s ease-in-out both}
.fill{fill:var(--coffee);animation:rise 2.6s .5s ease-out backwards}
.steam{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;opacity:.7;animation:steam 2.4s 3s ease-in-out infinite backwards}
#go{animation:pop .7s 3.2s backwards}
@keyframes pour{0%{transform:scaleY(0);opacity:1}15%{transform:scaleY(1);opacity:1}75%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes rise{from{transform:translateY(70px)}to{transform:none}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.7}100%{opacity:0;transform:translateY(-8px)}}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tile{position:relative;overflow:hidden}.tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.moods{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mood{position:relative;display:flex;align-items:flex-end;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;text-decoration:none;color:#fff;background:linear-gradient(160deg,var(--blush),var(--sage))}
.mood>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}.mood:hover>img{transform:scale(1.05)}
.mood span{position:relative;padding:28px 12px 12px;font:500 1.1rem 'Playfair Display',Georgia,serif;width:100%;background:linear-gradient(transparent,rgba(30,20,15,.78));text-shadow:0 1px 3px rgba(0,0,0,.5)}
.banner{height:150px;border-radius:var(--r);overflow:hidden;margin:0 0 20px}.banner img{width:100%;height:100%;object-fit:cover;display:block}.banner:empty{display:none}
.brand{display:flex;align-items:center;gap:8px}.brand svg{width:30px;height:30px;color:var(--coffee)}#slogo svg{width:56px;height:56px;color:var(--coffee)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{header,nav,.noprint{display:none}}
</style></head><body>
<header><a class="brand" href="#/" id="brand"><span id="logo"></span><span id="bname">La Douceur</span></a><nav aria-label="Main" id="nav"></nav></header>
<main id="app" tabindex="-1"></main>
<div id="splash" role="dialog" aria-modal="true" aria-label="Welcome"><svg viewBox="0 0 200 215" aria-hidden="true"><rect x="72" y="2" width="56" height="18" rx="9" fill="#38251F"/><rect class="stream" x="97" y="18" width="6" height="104" rx="3"/><ellipse cx="100" cy="196" rx="78" ry="12" fill="#E8C9C1"/><defs><clipPath id="cup"><path d="M50 112H150V150Q150 192 100 192Q50 192 50 150Z"/></clipPath></defs><g clip-path="url(#cup)"><rect class="fill" x="40" y="122" width="120" height="75"/></g><path d="M50 112H150V150Q150 192 100 192Q50 192 50 150Z" fill="none" stroke="#38251F" stroke-width="5"/><path d="M150 126h10a15 15 0 0 1 0 30h-12" fill="none" stroke="#38251F" stroke-width="5"/><path class="steam" d="M85 100q-8-10 0-20"/><path class="steam" d="M115 100q-8-10 0-20" style="animation-delay:3.4s"/></svg><div id="slogo"></div><h1 id="sname"></h1><p id="stag"></p><button class="btn" id="go">Start</button></div><div id="toast" class="toast" role="status" hidden></div>
<dialog id="dlg"><p id="dmsg"></p><div class="row"><button class="btn alt" id="dno">Cancel</button><button class="btn" id="dyes">Confirm</button></div></dialog>
<script>
"use strict";
/* ===== 1. CONFIG (edit brand here) ===== */
const BRAND={name:"La Douceur",tagline:"Your little corner of coffee."};
const K={espresso:"Espresso",milk:"Milk",oat:"Oat milk",almond:"Almond milk",coconut:"Coconut milk",condensed:"Condensed milk",cream:"Cream",cocoa:"Chocolate syrup",caramel:"Caramel sauce",vanilla:"Vanilla syrup",brown:"Brown sugar",honey:"Honey",cinnamon:"Cinnamon",strawberry:"Strawberries",orange:"Orange",matcha:"Matcha",pistachio:"Pistachio cream",rose:"Rose syrup",ube:"Ube paste",tonic:"Tonic water",icecream:"Vanilla ice cream",instant:"Instant coffee",coldbrew:"Cold brew",lavender:"Lavender syrup"};
const ALLERG=["Dairy","Tree nuts","Coconut"];
/* ===== 2. RECIPES: [id,name,type,desc,tags,sweet(1-3),mins,difficulty,caffeine,ingredients,steps,allergens,tip,hue,moods] ingredient=[qty,unit,label,key,optional] ===== */
const E=[1,"shot","Espresso (~30 ml)","espresso"],ICE=[0,"","Ice","" ,1];
const R=[
["spanish","Spanish Latte","iced","Creamy, sweet and rich with condensed milk.",["Creamy","Caramel"],3,5,"Easy","Medium",[E,[150,"ml","Milk","milk"],[2,"tbsp","Condensed milk","condensed"],ICE],"Stir espresso with condensed milk.|Pour over ice, then add milk. For hot, use steamed milk and skip the ice.",["Dairy"],"Warm the espresso so the condensed milk dissolves fully.",25,["Dessert in a Cup","Slow Sunday"]],
["strawberry","Strawberry Latte","iced","Fruity, creamy and summery.",["Fruity","Creamy"],3,6,"Easy","Medium",[[3,"","Ripe strawberries","strawberry"],[1,"tsp","Sugar",""],[150,"ml","Milk","milk"],E,ICE],"Mash strawberries with sugar.|Add to a glass, then ice and milk.|Pour espresso over the top.",["Dairy"],"Let the berries sit 2 minutes to release juice.",350,["Soft Girl Morning","Summer Refresher"]],
["lavender","Lavender Honey Latte","hot","Floral, delicate and lightly sweet.",["Floral","Creamy"],2,5,"Easy","Medium",[E,[180,"ml","Milk","milk"],[1,"tsp","Honey","honey"],[1,"tsp","Culinary lavender syrup","lavender"],ICE],"Stir honey and lavender syrup into the espresso.|Add milk and ice, or steamed milk for hot.",["Dairy"],"Start with half the lavender; it is strong.",270,["Rainy Day Reading","Slow Sunday"]],
["macchiato","Caramel Macchiato","iced","Buttery caramel, vanilla and coffee.",["Caramel","Creamy"],3,6,"Easy","Medium",[E,[180,"ml","Milk","milk"],[1,"tsp","Vanilla syrup","vanilla"],[1,"drizzle","Caramel sauce","caramel"],ICE],"Mix vanilla syrup into milk in a glass; add ice if cold.|Pour espresso over the milk.|Finish with caramel drizzle.",["Dairy"],"Pour espresso slowly for visible layers.",35,["Fancy Café at Home","Main Character Energy"]],
["matcha","Dirty Matcha","iced","Earthy, creamy and bold. Caffeine comes from both matcha and espresso.",["Bold","Creamy"],2,7,"Medium","High",[[1,"tsp","Matcha powder","matcha"],[50,"ml","Warm water",""],[150,"ml","Milk","milk"],E,ICE],"Whisk matcha with warm water until smooth.|Pour over iced milk.|Slowly add espresso.",["Dairy"],"Sift the matcha to avoid clumps.",110,["Study Fuel","Main Character Energy"]],
["mocha","Chocolate Mocha","iced","Rich, chocolatey and indulgent.",["Chocolatey","Creamy"],3,5,"Easy","Medium",[E,[1,"tbsp","Chocolate syrup","cocoa"],[180,"ml","Milk","milk"],[0,"","Whipped cream (optional)","cream",1],ICE],"Mix espresso with chocolate sauce.|Add milk and ice.|Top with whipped cream if you like.",["Dairy"],"Mix sauce into hot espresso first, never cold milk.",20,["Dessert in a Cup","Rainy Day Reading"]],
["tonic","Orange Espresso Tonic","iced","Citrusy, fizzy and refreshing.",["Fruity","Refreshing"],1,4,"Easy","Medium",[E,[150,"ml","Tonic water","tonic"],[2,"","Orange slices","orange"],ICE],"Fill a glass with ice and tonic.|Add orange slices.|Pour espresso slowly over the top.",[],"Chill the tonic first to keep the fizz.",40,["Summer Refresher","Study Fuel"]],
["pistachio","Pistachio Cream Latte","iced","Nutty, creamy and luxurious.",["Nutty","Creamy"],3,6,"Easy","Medium",[E,[180,"ml","Milk","milk"],[1,"tbsp","Pistachio cream","pistachio"],ICE],"Stir pistachio cream into milk until smooth.|Pour over ice and add espresso.|Garnish with crushed pistachios.",["Dairy","Tree nuts"],"Warm the milk slightly to blend the cream.",95,["Fancy Café at Home","Dessert in a Cup"]],
["sweetcream","Vanilla Sweet Cream Cold Brew","iced","Smooth, mellow and creamy.",["Creamy","Refreshing"],2,3,"Easy","High",[[180,"ml","Prepared cold brew","coldbrew"],[40,"ml","Cream","cream"],[1,"tsp","Vanilla syrup","vanilla"],ICE],"Pour cold brew over ice.|Mix cream with vanilla syrup.|Float the cream on top.",["Dairy"],"Shake the cream lightly so it floats.",30,["Study Fuel","Fancy Café at Home"]],
["coconut","Coconut Cloud Coffee","iced","Tropical, creamy and light.",["Refreshing","Creamy"],1,4,"Easy","Medium",[E,[150,"ml","Coconut milk (coconut-based, not dairy)","coconut"],[2,"tbsp","Lightly whipped cream (optional)","cream",1],ICE],"Pour coconut milk over ice.|Add espresso.|Top with whipped cream, or leave it off for dairy-free.",["Coconut"],"Shake the coconut milk can before opening.",60,["Summer Refresher"]],

["ube","Ube Latte","iced","Sweet, creamy and distinctive. Ube is purple yam; sweetness varies by brand.",["Creamy","Nutty"],3,5,"Easy","Medium",[E,[1.5,"tsp","Ube paste or syrup","ube"],[180,"ml","Milk","milk"],ICE],"Mix ube into milk until smooth.|Pour over ice.|Add espresso.",["Dairy"],"Taste the paste first and adjust to your brand.",285,["Soft Girl Morning","Dessert in a Cup"]],
["rose","Rose Latte","iced","Floral, fragrant and lightly sweet.",["Floral","Creamy"],2,5,"Easy","Medium",[E,[180,"ml","Milk","milk"],[1.5,"tsp","Rose syrup","rose"],ICE],"Stir rose syrup into milk.|Pour over ice and add espresso.|Garnish with food-safe edible petals.",["Dairy"],"Rose is potent; build up slowly.",345,["Soft Girl Morning","Slow Sunday"]],
["affogato","Classic Affogato","hot","Coffee, vanilla and dessert in one.",["Creamy","Caramel"],3,3,"Easy","Medium",[[1,"scoop","Vanilla ice cream (contains dairy)","icecream"],E],"Place ice cream in a chilled glass.|Pour hot espresso over it right before serving.",["Dairy"],"Chill the glass in the freezer for 10 minutes.",45,["Dessert in a Cup","Fancy Café at Home"]],
["dalgona","Dalgona Coffee","iced","Sweet, fluffy and coffee-forward.",["Bold","Creamy"],3,10,"Medium","Medium",[[2,"tbsp","Instant coffee","instant"],[2,"tbsp","Sugar",""],[2,"tbsp","Hot water",""],[180,"ml","Cold milk","milk"],ICE],"Whip coffee, sugar and hot water until thick and fluffy.|Spoon the foam over iced milk.",["Dairy"],"A hand whisk works, but a mixer is faster.",30,["Slow Sunday","Main Character Energy"]]
].map(a=>({id:a[0],name:a[1],type:a[2],desc:a[3],tags:a[4],sweet:a[5],mins:a[6],diff:a[7],caf:a[8],ing:a[9],steps:a[10].split("|"),allergens:a[11],tip:a[12],hue:a[13],moods:a[14]}));
const MOODS=["Soft Girl Morning","Study Fuel","Rainy Day Reading","Dessert in a Cup","Summer Refresher","Main Character Energy","Slow Sunday","Fancy Café at Home"];
/* ===== 3. STORAGE ===== */
const KEY="amora.v1",DEF={fav:[],tried:[],journal:[],pantry:[],set:{theme:"amora",name:BRAND.name},days:[]};
let S=load();
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==="object"){const r={...DEF,...o,set:{...DEF.set,...(o.set||{})}};if(r.set.name==="Café Amora")r.set.name=BRAND.name;return r}return structuredClone(DEF)}catch(e){return structuredClone(DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save: browser storage is full or blocked.")}}
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=id=>R.find(r=>r.id===id);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function ask(msg){return new Promise(res=>{const d=$("#dlg");$("#dmsg").textContent=msg;d.showModal();$("#dyes").onclick=()=>{d.close();res(true)};$("#dno").onclick=()=>{d.close();res(false)}})}
const icon={iced:"🧊",hot:"☕"};
const LOGO='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 40C16 28 24 18 38 8"/><path d="M17 31c-6-1-9-5-9-9 5 0 8 3 9 9z"/><path d="M23 24c-1-6 1-10 6-12 1 5-1 9-6 12z"/><path d="M31 17c1-5 5-8 10-8 0 5-4 8-10 8z"/><ellipse cx="32" cy="33" rx="4" ry="5.5" transform="rotate(-25 32 33)"/><path d="M30 38c2-3 3-7 3-9"/><ellipse cx="40" cy="30" rx="3.5" ry="5" transform="rotate(-25 40 30)"/></svg>';
/* Images live in assets/. A missing file is removed, which reveals the coloured fallback tile. */
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const IMG=(f,alt,fb,eager)=>`<img src="assets/${f}" alt="${esc(alt)}" ${eager?"":'loading="lazy" '}${fb?`data-fb="assets/${fb}" `:""}onerror="if(this.dataset.fb){this.src=this.dataset.fb;delete this.dataset.fb}else this.remove()">`;
const rimg=(r,eager,over)=>IMG(over||"recipes/"+slug(r.name)+".jpg",r.name+": "+r.desc,over?"recipes/"+slug(r.name)+".jpg":"",eager);

function qty(n,u){if(!n)return"";const v=u==="ml"?Math.round(n):Math.round(n*2)/2;return(v%1?v.toFixed(1):v)+(u?" "+u:"")}
function dayIdx(){const d=new Date();return(d.getFullYear()*366+d.getMonth()*31+d.getDate())%R.length}
function card(r,over){const f=S.fav.includes(r.id);return`<div class="fc"><div class="inner"><div class="face front card"><button class="tile" style="--h:${r.hue}" data-flip aria-label="Flip ${esc(r.name)} card to see ingredients"><span aria-hidden="true">${icon[r.type]}</span>${rimg(r,0,over)}</button><div class="b"><div class="row"><h3>${esc(r.name)}</h3><button class="fav" data-fav="${r.id}" aria-pressed="${f}" aria-label="${f?"Remove":"Save"} ${esc(r.name)} ${f?"from":"to"} favourites">${f?"♥":"♡"}</button></div><p class="meta" style="margin:0">${esc(r.desc)}</p><div>${r.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="meta">${r.type==="iced"?"Iced":"Hot"} · ${r.mins} min · ${r.diff}</div></div></div><div class="face back card"><div class="b"><div><h3>${esc(r.name)}</h3><ul class="plain">${r.ing.map(i=>`<li>${i[0]?qty(i[0],i[1])+" ":""}${esc(i[2].split(" (")[0])}${i[4]?" (optional)":""}</li>`).join("")}</ul></div><div class="row"><a class="btn" href="#/r/${r.id}">Open recipe</a><button class="btn alt" data-flip>Flip back</button></div></div></div></div></div>`}
/* ===== 5. ROUTER ===== */
const NAV=[["","Home"],["explore","Explore"],["quiz","Find My Coffee"],["kitchen","My Kitchen"],["journal","Journal"],["settings","My Café"]];
const V={};
function route(){const h=location.hash.replace(/^#\/?/,"");const[p,...rest]=h.split("/");const q=h.split("?")[1]||"";const page=(p||"").split("?")[0];
$("#nav").innerHTML=NAV.map(([k,l])=>`<a href="#/${k}" ${(page||"")===k||(page==="r"&&k==="explore")?'aria-current="page"':""}>${l}</a>`).join("");
const main=$("#app");(V[page]||V[""])(main,rest[0]?.split("?")[0],new URLSearchParams(q));window.scrollTo(0,0);main.focus({preventScroll:true})}
addEventListener("hashchange",route);
/* ===== HOME ===== */
V[""]=m=>{const t=get(R[dayIdx()].id);if(!S.days.includes(todayKey())){S.days.push(todayKey());S.days=S.days.slice(-60);save()}
m.innerHTML=`<section class="hero"><div><p class="meta">Your daily coffee ritual</p><h1>Welcome to your little corner of coffee.</h1><p>Discover, make and collect coffee recipes you will actually want to drink.</p><div class="row"><a class="btn" href="#/quiz">Find Your Coffee</a><a class="btn alt" href="#/explore">Explore the Menu</a><button class="btn alt" data-act="surprise">Surprise me</button></div></div><a class="tile" style="--h:25;border-radius:var(--r);aspect-ratio:1;font-size:6rem" href="#/r/spanish" aria-label="Open Spanish Latte">🧊${IMG("hero-iced-latte.jpg","Iced latte in warm sunlight",0,1)}</a></section>
<h2>Coffee of the day</h2><div class="grid" style="grid-template-columns:minmax(250px,360px)">${card(t,"coffee-of-the-day.jpg")}</div>
<h2 style="margin-top:36px">Explore by mood</h2><div class="moods">${MOODS.map(x=>`<a class="mood" href="#/explore?mood=${encodeURIComponent(x)}">${IMG("moods/"+slug(x)+".jpg",x+" mood")}<span>${x}</span></a>`).join("")}</div>
<h2 style="margin-top:36px">Your café</h2><div class="panel stats"><div><b>${S.tried.length}</b>tried</div><div><b>${S.fav.length}</b>favourites</div><div><b>${streak()}</b>day streak</div></div>
${S.tried.length?"":'<p class="meta">Nothing here yet. Mark a recipe as tried and your count starts.</p>'}
<h2>Popular recipes</h2><div class="grid">${R.slice(0,6).map(card).join("")}</div>`};
const todayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function streak(){let n=0;const d=new Date();if(!S.days.includes(todayKey(d)))d.setDate(d.getDate()-1);while(S.days.includes(todayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
/* ===== EXPLORE ===== */
V.explore=(m,_,q)=>{const mood=q.get("mood")||"";
m.innerHTML=`<h1>Explore recipes</h1><div class="row panel noprint"><div><label for="q">Search drink or ingredient</label><input id="q" type="search"></div><div><label for="ft">Temperature</label><select id="ft"><option value="">Any</option><option value="iced">Iced</option><option value="hot">Hot</option></select></div><div><label for="ff">Flavour</label><select id="ff"><option value="">Any</option>${["Chocolatey","Fruity","Floral","Nutty","Caramel","Creamy","Bold","Refreshing"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label for="fm">Mood</label><select id="fm"><option value="">Any</option>${MOODS.map(x=>`<option ${x===mood?"selected":""}>${x}</option>`).join("")}</select></div><div><label for="fs">Sort</label><select id="fs"><option value="n">A to Z</option><option value="t">Quickest</option></select></div><button class="btn alt" id="fc">Clear</button></div><p class="meta" id="cnt" aria-live="polite"></p><div class="grid" id="res"></div>`;
const upd=()=>{const q=$("#q").value.toLowerCase(),t=$("#ft").value,f=$("#ff").value,mo=$("#fm").value;let L=R.filter(r=>(!q||(r.name+r.ing.map(i=>i[2]).join(" ")).toLowerCase().includes(q))&&(!t||r.type===t)&&(!f||r.tags.includes(f))&&(!mo||r.moods.includes(mo)));
L.sort($("#fs").value==="t"?(a,b)=>a.mins-b.mins:(a,b)=>a.name.localeCompare(b.name));
$("#cnt").textContent=L.length+" recipe"+(L.length===1?"":"s");$("#res").innerHTML=L.length?L.map(card).join(""):'<div class="empty" style="grid-column:1/-1">No drinks match those filters. Try clearing one.</div>'};
m.querySelectorAll("input,select").forEach(e=>e.oninput=upd);$("#fc").onclick=()=>{m.querySelectorAll("input,select").forEach(e=>e.value="");upd()};upd()};
/* ===== DETAIL ===== */
V.r=(m,id)=>{const r=get(id);if(!r){m.innerHTML='<div class="empty">Recipe not found. <a href="#/explore">Browse all recipes</a></div>';return}
let sv=1;const draw=()=>{const f=S.fav.includes(r.id);m.innerHTML=`<a href="#/explore" class="noprint">← All recipes</a><div class="hero" style="margin-top:16px"><div class="tile" style="--h:${r.hue};border-radius:var(--r);font-size:5rem"><span aria-hidden="true">${icon[r.type]}</span>${rimg(r,1)}</div><div><h1>${esc(r.name)}</h1><p><em>${esc(r.desc)}</em></p><div>${r.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div><p class="meta">${r.type==="iced"?"Iced":"Hot"} · ${r.mins} min · ${r.diff} · Caffeine: ${r.caf} · Sweetness ${r.sweet}/3</p>
<div class="row noprint"><button class="btn" data-fav="${r.id}" aria-pressed="${f}">${f?"♥ Saved":"♡ Save"}</button><button class="btn alt" data-tried="${r.id}">${S.tried.includes(r.id)?"✓ Tried":"Mark as tried"}</button><a class="btn alt" href="#/journal?add=${r.id}">Add to journal</a><button class="btn alt" data-share="${r.id}">Share</button><button class="btn alt" onclick="print()">Print</button></div></div></div>
<div class="panel"><div class="row"><h2 style="margin:0">Ingredients</h2><span class="row noprint" style="margin-left:auto"><button class="btn alt" data-sv="-1" aria-label="Fewer servings">−</button><b aria-live="polite">${sv} serving${sv>1?"s":""}</b><button class="btn alt" data-sv="1" aria-label="More servings">+</button></span></div><ul class="plain">${r.ing.map(i=>`<li><label style="color:inherit;font-size:1rem"><input type="checkbox" style="min-height:0"> ${i[0]?qty(i[0]*sv,i[1])+" ":""}${esc(i[2])}${i[4]?" (optional)":""}</label></li>`).join("")}</ul><p class="meta">Quantities are for one serving, scaled. Ingredient cost estimates are not included.</p></div>
<div class="panel"><h2>Method</h2><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p><em>Barista tip: ${esc(r.tip)}</em></p></div>
${r.allergens.length?`<p class="warn">Contains: ${r.allergens.join(", ")}.${r.id==="pistachio"?" Tree-nut allergen warning.":""}</p>`:""}
<h2 style="margin-top:28px">You might also like</h2><div class="grid">${R.filter(x=>x.id!==r.id&&x.tags.some(t=>r.tags.includes(t))).slice(0,3).map(card).join("")}</div>`};
V.r.redraw=draw;V.r.step=d=>{sv=Math.max(1,Math.min(8,sv+d));draw()};draw()};
/* ===== QUIZ ===== */
const QZ=[["What temperature do you prefer?",["Iced","Hot","Either"]],["Choose your flavour.",["Chocolatey","Caramel","Fruity","Floral","Nutty","Bold"]],["How sweet?",["Not sweet","A little sweet","Dessert-level"]],["How much time do you have?",["Under 5 minutes","5 to 10 minutes","More than 10"]]];
let qa=[];
V.quiz=m=>{const n=qa.length;if(n<QZ.length){const[q,o]=QZ[n];m.innerHTML=`<h1>Find your coffee</h1>${BAN("lifestyle/paris-sunset-coffee.jpg","Coffee cup with a Paris skyline at sunset")}<progress max="${QZ.length}" value="${n}" aria-label="Quiz progress"></progress><div class="panel"><h2>${q}</h2><div class="row">${o.map((x,i)=>`<button class="chip" data-qa="${i}">${x}</button>`).join("")}</div></div><div class="row">${n?'<button class="btn alt" data-act="qback">Back</button>':""}</div>`;return}
const sc=R.map(r=>{let s=0,w=[];if(qa[0]===0&&r.type==="iced"||qa[0]===1&&r.type==="hot"||qa[0]===2){s+=2;w.push(qa[0]===2?"works hot or iced":"your temperature")}
const fl=QZ[1][1][qa[1]];if(r.tags.includes(fl)||(fl==="Caramel"&&r.tags.includes("Caramel"))){s+=3;w.push("a "+fl.toLowerCase()+" flavour")}
if(Math.abs(r.sweet-(qa[2]+1))===0){s+=2;w.push("your sweetness")}else if(Math.abs(r.sweet-(qa[2]+1))===1)s+=1;
const lim=[5,10,99][qa[3]];if(r.mins<=lim){s+=1;w.push("fits your time")}return{r,s,w}}).sort((a,b)=>b.s-a.s).slice(0,3);
m.innerHTML=`<h1>Your top matches</h1><p class="meta">Scoring: temperature 2, flavour 3, sweetness 2 (1 if close), time 1.</p><div class="grid">${sc.map(x=>card(x.r)+`<p class="meta" style="grid-column:auto;margin-top:-10px">Why: ${x.w.join(", ")||"closest available"}.</p>`).join("")}</div><p><button class="btn alt" data-act="qreset">Restart quiz</button></p>`};
/* ===== KITCHEN ===== */
V.kitchen=m=>{const draw=()=>{const P=new Set(S.pantry);const ex=$("#ex")?.value||"";
const L=R.filter(r=>!ex||!r.allergens.includes(ex)).map(r=>{const need=r.ing.filter(i=>i[3]&&!i[4]);return{r,miss:need.filter(i=>!P.has(i[3]))}}).sort((a,b)=>a.miss.length-b.miss.length);
m.innerHTML=`<h1>What's in my kitchen?</h1>${BAN("lifestyle/coffee-beans-bowl.jpg","Wooden bowl of coffee beans")}<div class="panel"><div class="row">${Object.entries(K).map(([k,l])=>`<button class="chip" data-pan="${k}" aria-pressed="${P.has(k)}">${l}</button>`).join("")}</div><div class="row" style="margin-top:14px"><div><label for="ex">Exclude allergen</label><select id="ex"><option value="">None</option>${ALLERG.map(a=>`<option ${a===ex?"selected":""}>${a}</option>`).join("")}</select></div><button class="btn alt" data-act="pclear">Clear all</button></div></div>
<div class="grid">${L.map(({r,miss})=>`<div>${card(r)}<p class="${miss.length?"meta":""}"><b>${miss.length?"Almost there":"You can make this now"}</b>${miss.length?" · missing "+miss.map(i=>esc(i[2].split(" (")[0])).join(", "):""}</p></div>`).join("")||'<div class="empty">No recipes left after excluding that allergen.</div>'}</div>`;$("#ex").onchange=draw};V.kitchen.draw=draw;draw()};
/* ===== JOURNAL ===== */
V.journal=(m,_,q)=>{const pre=q.get("add")||"";const L=[...S.journal].reverse();
m.innerHTML=`<h1>Coffee journal</h1>${BAN("lifestyle/cozy-reading-bed.jpg","Coffee cup and book on a cosy bed")}<p class="meta">Entries are stored only in this browser and do not sync between devices.</p><form class="panel" id="jf"><div class="row"><div><label for="jr">Recipe</label><select id="jr" required>${R.map(r=>`<option value="${r.id}" ${r.id===pre?"selected":""}>${esc(r.name)}</option>`).join("")}</select></div><div><label for="js">Rating</label><select id="js">${[5,4,3,2,1].map(n=>`<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select></div></div><label for="jn" style="margin-top:10px">Tasting notes</label><textarea id="jn" rows="3" style="width:100%" maxlength="500" required></textarea><p><button class="btn">Save entry</button></p></form>
${L.length?L.map(e=>`<div class="panel"><b>${esc(get(e.r)?.name||"Recipe")}</b> <span aria-label="${e.s} stars">${"★".repeat(e.s)}</span><span class="meta"> · ${esc(e.d)}</span><p>${esc(e.n)}</p><button class="btn alt" data-jdel="${e.id}">Delete</button></div>`).join(""):'<div class="empty">'+BAN("lifestyle/journal-flatlay.jpg","Latte beside an open journal and flowers")+'Your journal is empty. Make a drink and write down how it tasted.</div>'}`;
$("#jf").onsubmit=ev=>{ev.preventDefault();const n=$("#jn").value.trim();if(!n){toast("Add a note first.");return}
S.journal.push({id:Date.now().toString(36),r:$("#jr").value,s:+$("#js").value,n,d:todayKey()});if(!S.tried.includes($("#jr").value))S.tried.push($("#jr").value);save();toast("Entry saved");V.journal(m,_,new URLSearchParams())}};
/* ===== SETTINGS ===== */
V.settings=m=>{m.innerHTML=`<h1>My café</h1>${BAN("lifestyle/cafe-interior-desk.jpg","Warm café interior with a reading desk")}<div class="panel"><label for="sn">Café name</label><input id="sn" value="${esc(S.set.name)}" maxlength="30"><label for="st" style="margin-top:12px">Theme</label><select id="st"><option value="amora">La Douceur</option><option value="matcha">Matcha Morning</option><option value="midnight">Midnight Roast</option></select></div>
<div class="panel"><h2>Your data</h2><p class="meta">Everything lives in this browser's localStorage.</p><div class="row"><button class="btn alt" data-act="export">Export JSON</button><label class="btn alt" for="imp" style="color:inherit;font-size:1rem">Import JSON</label><input id="imp" type="file" accept="application/json" hidden><button class="btn alt" data-act="reset">Reset everything</button></div></div>`;
$("#st").value=S.set.theme;$("#st").onchange=e=>{S.set.theme=e.target.value;save();theme()};$("#sn").onchange=e=>{S.set.name=e.target.value.trim()||BRAND.name;save();theme();toast("Saved")};
$("#imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.fav)||!Array.isArray(o.journal))throw 0;if(await ask("Replace your current data with this backup?")){S={...DEF,...o,set:{...DEF.set,...o.set}};save();theme();route();toast("Imported")}}catch(x){toast("That file is not a valid La Douceur backup.")}}};
function theme(){document.documentElement.dataset.theme=S.set.theme;$("#logo").innerHTML=LOGO;$("#bname").textContent=S.set.name;document.title=S.set.name}
/* ===== EVENTS ===== */
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if("flip" in d){t.closest(".fc").classList.toggle("flipped")}
else if(d.fav){const i=S.fav.indexOf(d.fav);i<0?S.fav.push(d.fav):S.fav.splice(i,1);save();toast(i<0?"Saved to favourites":"Removed");
if(location.hash.startsWith("#/r/"))V.r.redraw();else document.querySelectorAll('.fav[data-fav="'+d.fav+'"]').forEach(b=>{const on=S.fav.includes(d.fav);b.textContent=on?"♥":"♡";b.setAttribute("aria-pressed",on);b.setAttribute("aria-label",(on?"Remove":"Save")+" "+get(d.fav).name+(on?" from":" to")+" favourites")})}
else if(d.tried){if(!S.tried.includes(d.tried)){S.tried.push(d.tried);save();toast("Marked as tried")}V.r.redraw()}
else if(d.sv)V.r.step(+d.sv);
else if(d.share){const r=get(d.share),tx=r.name+": "+r.ing.map(i=>qty(i[0],i[1])+" "+i[2]).join(", ");try{navigator.share?await navigator.share({title:r.name,text:tx}):(await navigator.clipboard.writeText(tx),toast("Recipe summary copied"))}catch(x){}}
else if(d.qa){qa.push(+d.qa);route()}
else if(d.pan){const i=S.pantry.indexOf(d.pan);i<0?S.pantry.push(d.pan):S.pantry.splice(i,1);save();V.kitchen.draw()}
else if(d.jdel){if(await ask("Delete this journal entry?")){S.journal=S.journal.filter(x=>x.id!==d.jdel);save();route()}}
else if(d.act==="qback"){qa.pop();route()}else if(d.act==="qreset"){qa=[];route()}
else if(d.act==="pclear"){S.pantry=[];save();V.kitchen.draw()}
else if(d.act==="surprise"){location.hash="#/r/"+R[Math.floor(Math.random()*R.length)].id}
else if(d.act==="export"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="la-douceur-backup.json";a.click();URL.revokeObjectURL(a.href)}
else if(d.act==="reset"&&await ask("Erase all favourites, journal entries and settings?")){S=structuredClone(DEF);save();theme();route()}});
/* ===== INIT ===== */
theme();route();
(function(){const sp=$("#splash"),stuff=[$("header"),$("#app"),$("#nav")];$("#slogo").innerHTML=LOGO;$("#sname").textContent=S.set.name;$("#stag").textContent=BRAND.tagline;
document.body.classList.add("splash-on");stuff.forEach(e=>e.inert=true);
$("#go").onclick=()=>{sp.classList.add("leaving");document.body.classList.remove("splash-on");stuff.forEach(e=>e.inert=false);setTimeout(()=>{sp.remove();$("#app").focus({preventScroll:true})},700)};
$("#go").focus()})();
</script></body></html>
